<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>AI Kurgu</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0e1116; color: #e6e9f0; font-family: "Segoe UI", system-ui, sans-serif; -webkit-app-region: drag; user-select: none; }
      .wrap { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 0 32px; box-sizing: border-box; text-align: center; }
      .logo { width: 56px; height: 56px; border-radius: 14px; background: #f5b301; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #111; font-weight: 900; }
      h1 { margin: 0; font-size: 20px; }
      #text { font-size: 14px; color: #c9cfdb; min-height: 20px; }
      #detail { font-size: 11px; color: #8b93a7; min-height: 28px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; }
      .bar { width: 260px; height: 4px; background: #1d2230; border-radius: 4px; overflow: hidden; }
      .bar > div { width: 35%; height: 100%; background: #f5b301; border-radius: 4px; animation: slide 1.4s ease-in-out infinite; }
      @keyframes slide { 0% { margin-left: -35%; } 100% { margin-left: 100%; } }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="logo">▶</div>
      <h1>AI Kurgu</h1>
      <div class="bar"><div></div></div>
      <div id="text">Başlatılıyor…</div>
      <div id="detail"></div>
    </div>
    <script>
      window.kurgu?.onStatus(({ text, detail }) => {
        document.getElementById("text").textContent = text;
        document.getElementById("detail").textContent = detail || "";
      });
    </script>
  </body>
</html>
