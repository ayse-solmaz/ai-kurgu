<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../base.css">
<style>
  .pos-lower { top: 50vh; }
  .row { display: flex; flex-direction: column; align-items: center; gap: 2.2vw; position: relative; }
  .handle { font: 600 3.6vw "Inter"; color: rgba(255,255,255,.86); padding: 1vw 3vw; border-radius: 99vw; }
  .btn {
    position: relative; display: flex; align-items: center; gap: 2.6vw; padding: 3vw 6vw 3vw 4.4vw;
    border-radius: 99vw; font: 700 5.6vw/1 "Inter"; letter-spacing: -0.02em; color: #fff;
    background: var(--c); box-shadow: 0 2vw 5vw color-mix(in srgb, var(--c) 40%, transparent), inset 0 .2vw 0 rgba(255,255,255,.35);
    transition: none;
  }
  .btn .ic { width: 7vw; height: 7vw; position: relative; }
  .btn .ic svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .btn .lbl { position: relative; white-space: nowrap; }
  .btn .lbl span { display: block; }
  .btn .lbl .b { position: absolute; left: 0; top: 0; opacity: 0; }
  .btn.done { background: rgba(120,120,128,.42); box-shadow: inset 0 .2vw 0 rgba(255,255,255,.22); }
  .clip { position: absolute; inset: 0; border-radius: inherit; overflow: hidden; pointer-events: none; }
  .ripple { position: absolute; left: var(--rx); top: var(--ry); width: 6vw; height: 6vw; margin: -3vw 0 0 -3vw; border-radius: 50%;
            background: rgba(255,255,255,.55); opacity: 0; }
  .cursor { position: absolute; width: 9vw; height: 9vw; left: 0; top: 0; filter: drop-shadow(0 .8vw 1.2vw rgba(0,0,0,.35)); }
  .burst { position: absolute; left: 50%; top: 50%; width: 1.6vw; height: 1.6vw; margin: -.8vw; border-radius: 50%; background: var(--c); opacity: 0; }
  /* klasik tema (apple dışı) */
  :root:not([data-theme="apple"]) .btn { font-family: "Montserrat"; font-weight: 800; text-transform: uppercase; letter-spacing: .02em; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="../../runtime.js"></script>
<script>
  const P = K.params;
  const apple = document.documentElement.dataset.theme === "apple";
  // ikonlar (basit, özgün SVG çizimler)
  const I = {
    bell: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.6 2H4.4L6 16z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>',
    heart: '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 20.6s-7.6-4.6-9.2-9.3C1.6 7.7 3.9 4.6 7.2 4.6c2 0 3.5 1.1 4.8 2.8 1.3-1.7 2.8-2.8 4.8-2.8 3.3 0 5.6 3.1 4.4 6.7-1.6 4.7-9.2 9.3-9.2 9.3z"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
    check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    chat: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5.5h16v10.5H10l-4.5 3.5V16H4z"/></svg>',
    share: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v11M7.5 8 12 3.5 16.5 8"/><path d="M5 12.5V20h14v-7.5"/></svg>',
    cursor: '<svg viewBox="0 0 24 24"><path d="M5 2.8v16.6l4.3-4.1 2.8 6.4 2.9-1.3-2.8-6.3h6.1z" fill="#fff" stroke="#111" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  };
  const V = {
    subscribe: { c: apple ? "#FF3B30" : "#ff2d3d", ic: "bell", ic2: "check", a: "Abone ol", b: "Abone olundu" },
    like:      { c: apple ? "#FF375F" : "#ff3d6e", ic: "heart", ic2: "heart", a: "Beğen", b: "Beğenildi" },
    follow:    { c: apple ? "#0A84FF" : "#2f7bff", ic: "plus", ic2: "check", a: "Takip et", b: "Takip ediliyor" },
    comment:   { c: apple ? "#30D158" : "#22c47a", ic: "chat", ic2: "check", a: "Yorum yap", b: "Teşekkürler!" },
    share:     { c: apple ? "#5E5CE6" : "#7b61ff", ic: "share", ic2: "check", a: "Paylaş", b: "Paylaşıldı" },
    bell:      { c: apple ? "#FF9F0A" : "#ffb703", ic: "bell", ic2: "bell", a: "Bildirimleri aç", b: "Bildirimler açık" },
  };
  const v = V[P.variant] || V.subscribe;
  document.documentElement.style.setProperty("--c", v.c);

  const slot = K.el("div", `card-slot pos-${P.position || "lower"}`);
  const row = K.el("div", "row");
  if (P.handle) row.appendChild(K.at(K.el("div", "handle glass a-rise", K.esc(P.handle)), 0.05));
  const btn = K.at(K.el("div", "btn a-pop"), 0.12);
  const ic = K.el("div", "ic");
  const ic1 = K.el("div", "", I[v.ic]); const ic2 = K.el("div", "", I[v.ic2]);
  ic1.style.cssText = ic2.style.cssText = "position:absolute;inset:0";
  ic.append(ic1, ic2);
  const lbl = K.el("div", "lbl");
  const la = K.el("span", "a", K.esc(P.label || v.a)); const lb = K.el("span", "b", K.esc(P.done_label || v.b));
  lbl.append(la, lb);
  const ripple = K.el("div", "ripple");
  const clip = K.el("div", "clip"); clip.appendChild(ripple);
  btn.append(ic, lbl, clip);
  const bursts = [];
  for (let i = 0; i < 8; i++) { const b = K.el("div", "burst"); btn.appendChild(b); bursts.push(b); }
  row.appendChild(btn);
  const cur = K.el("div", "cursor", I.cursor);
  row.appendChild(cur);
  slot.appendChild(row);
  document.getElementById("stage").appendChild(slot);

  // zamanlama: imleç gelir (0.6-1.25 s), tıklar (1.3 s), buton "yapıldı" durumuna geçer
  const T = { inA: 0.55, inB: 1.25, click: 1.32 };
  const lerp = (a, b, x) => a + (b - a) * x;
  const draw = (t) => {
    const bw = btn.offsetWidth, bh = btn.offsetHeight;
    const bx = btn.offsetLeft, by = btn.offsetTop;
    // imleç: sağ alttan butonun sağ-orta noktasına yay çizerek gelir
    const tx = bx + bw * 0.72, ty = by + bh * 0.55;
    const x = K.ease((t - T.inA) / (T.inB - T.inA));
    const cx = lerp(tx + bw * 0.55, tx, x), cy = lerp(ty + bh * 2.2, ty, x) - Math.sin(x * Math.PI) * bh * 0.4;
    const press = t > T.click - 0.06 && t < T.click + 0.12 ? 0.86 : 1;
    cur.style.opacity = String(Math.min(1, Math.max(0, (t - T.inA) / 0.15)) * (t > K.duration - 0.9 ? Math.max(0, (K.duration - 0.6 - t) / 0.3) : 1));
    cur.style.transform = `translate(${cx}px, ${cy}px) scale(${press})`;
    // tıklama: buton küçülüp büyür, dalga yayılır, durum değişir
    const k = (t - T.click) / 0.35;
    const done = t >= T.click;
    btn.classList.toggle("done", done && P.variant !== "like" && P.variant !== "bell");
    btn.style.scale = k > 0 && k < 1 ? String(1 - 0.08 * Math.sin(k * Math.PI)) : "1";
    ripple.style.setProperty("--rx", `${bw * 0.72}px`); ripple.style.setProperty("--ry", `${bh * 0.55}px`);
    const r = (t - T.click) / 0.6;
    ripple.style.opacity = r > 0 && r < 1 ? String(0.6 * (1 - r)) : "0";
    ripple.style.transform = `scale(${1 + Math.max(0, r) * 9})`;
    ic1.style.opacity = done ? "0" : "1"; ic2.style.opacity = done ? "1" : "0";
    ic2.style.transform = done ? `scale(${1 + 0.35 * Math.max(0, 1 - (t - T.click) / 0.3)})` : "scale(.4)";
    la.style.opacity = done ? "0" : "1"; lb.style.opacity = done ? "1" : "0";
    lbl.style.width = `${(done ? lb : la).offsetWidth}px`;
    // beğeni/zil: küçük parçacık patlaması
    bursts.forEach((b, i) => {
      const q = (t - T.click) / 0.55;
      const a = (i / bursts.length) * Math.PI * 2;
      const d = K.ease(q) * bh * 0.95;
      b.style.opacity = q > 0 && q < 1 ? String(1 - q) : "0";
      b.style.left = `${bw * 0.12 + 3.5 * innerWidth / 100}px`;
      b.style.transform = `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d}px)`;
    });
  };
  K.onFrame(draw);
  draw(0);
</script>
</body>
</html>
