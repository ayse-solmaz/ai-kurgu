minimax-h3-image:
  kind: image
  source: MiniMaxAI/MiniMax-H3-Image
  license: MiniMax-H3-Image-Community
  commercial_ok: false
  remote_only: true                 # 33.1B DiT, ~69 GB BF16; yalnızca bulut GPU worker'da çalışır
  note: >-
    AB, Birleşik Krallık, ABD ve Güney Kore lisans kapsamı dışında (çıktıların oralarda
    kullanılması/gösterilmesi dahil). Başkalarına hizmet (SaaS/API) sunmak veya yıllık
    1M USD üstü gelir için MiniMax'tan yazılı izin gerekir. Ticari üründe arayüzde
    "MiniMax-H3-Image" ibaresi gösterilmeli. Çıktılar başka model eğitmek için kullanılamaz.

