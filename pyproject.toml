[project]
name = "kurgu"
version = "0.1.0"
description = "Açık kaynak, ajan tabanlı AI video kurgu uygulaması"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # çekirdek
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "numpy>=1.26",
    "pillow>=10.4",
    # konuşma tanıma + VAD (MIT)
    "faster-whisper>=1.1",
    # yüz takibi ve sahne tespiti (OpenCV YuNet)
    "opencv-python-headless>=4.10",
    # yerel görsel üretimi (Intel OpenVINO, Apache-2.0)
    "openvino>=2025.1",
    "openvino-genai>=2025.1",
    "huggingface-hub>=0.25",
    # web API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "fonttools>=4.50",
]

[project.optional-dependencies]
# Dış ses: Chatterbox Multilingual (MIT, Türkçe, ses klonlama). torch gerektirir (~2 GB).
tts = [
    "chatterbox-tts>=0.1.4",
]

[project.scripts]
kurgu = "kurgu.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kurgu"]

[dependency-groups]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
